name: Build and Test Swift Playgroud
run-name: ${{ github.actor }} has launched a build
on: [push]
jobs:
  TestAPIServer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm install
      - run: npm test
